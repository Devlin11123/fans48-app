<style>
:root {
    --primary-color:#e60012;
    --primary-glow:rgba(230,0,18,.4);
    --dark-bg:#0b0c10;
    --card-bg:#151821;
    --card-border:#262b3a;
    --text-color:#ffffff;
    --muted-color:#a0a5b5;
    --accent-gold:#ffb703;
}

body {
    background-color: var(--dark-bg);
    color: var(--text-color);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    transition: background-color .3s, color .3s;
    min-height: 100vh;
}

/* FIX LIGHT MODE */
body.light-mode {
    --dark-bg: #f8f9fa;
    --card-bg: #ffffff;
    --card-border: #dee2e6;
    --text-color: #212529;
    --muted-color: #6c757d;
}

body.light-mode .navbar {
    background: rgba(255, 255, 255, 0.95) !important;
}

body.light-mode .navbar-brand,
body.light-mode .nav-link {
    color: #212529 !important;
}

body.light-mode .card,
body.light-mode .modal-content {
    background-color: var(--card-bg) !important;
    color: var(--text-color) !important;
    border-color: var(--card-border) !important;
}

body.light-mode .form-control,
body.light-mode .form-select {
    background-color: #ffffff !important;
    color: #212529 !important;
    border-color: #ced4da !important;
}

/* NAVBAR FIX */
.navbar {
    background: rgba(11, 12, 16, 0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--card-border);
    z-index: 1030;
}

.navbar-brand {
    font-weight: 800;
    color: #fff !important;
}

.navbar-brand span {
    color: var(--primary-color);
}

.nav-link {
    color: var(--muted-color) !important;
    font-weight: 600;
    padding: .5rem 1rem !important;
    border-radius: 8px;
    transition: all 0.2s ease-in-out;
}

.nav-link:hover {
    color: #fff !important;
    background: rgba(255,255,255,.08);
}

.nav-link.active {
    color: #fff !important;
    background: linear-gradient(135deg, var(--primary-color), #b3000e);
}

/* CARDS & UI */
.card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    color: var(--text-color);
    transition: .3s;
}

.hero-banner {
    background: linear-gradient(135deg, rgba(230,0,18,0.2), rgba(15,18,25,0.9)), var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 40px 30px;
}

.topup-card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    transition: .3s;
    cursor: pointer;
}

.topup-card:hover {
    transform: translateY(-5px);
    border-color: var(--accent-gold);
}

.cash-badge {
    background: linear-gradient(135deg, #1e2330, #13161f);
    border: 1px solid var(--accent-gold);
    color: var(--accent-gold);
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 30px;
    cursor: pointer;
}

/* FORM CONTROL FIX */
.form-control, .form-select {
    background-color: #151821 !important;
    border: 1px solid var(--card-border) !important;
    color: #ffffff !important;
    border-radius: 10px;
}

.form-control::placeholder {
    color: #888888 !important;
}

.form-control:focus, .form-select:focus {
    border-color: var(--primary-color) !important;
    box-shadow: 0 0 10px var(--primary-glow) !important;
}

.section-title {
    border-left: 5px solid var(--primary-color);
    padding-left: 12px;
    margin-bottom: 24px;
}

/* MODAL FIX (PENTING AGAR TIDAK HILANG) */
.modal {
    z-index: 1055 !important;
}

.modal-backdrop {
    z-index: 1050 !important;
}

.modal-content {
    background-color: #151821 !important;
    color: #ffffff !important;
    border: 1px solid var(--card-border);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.badge-live {
    background: var(--primary-color);
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .6; }
}

.ratio-16x9 {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #000;
}

.ratio-16x9 iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

.chat-box {
    height: 350px;
    overflow-y: auto;
    background: #0e1017;
}
</style>
</head>

</ul>

</div>
</div>

<!-- KONTEN UTAMA -->
<div class="container my-4" id="main-content"></div>

<!-- AUTH MODAL (LOGIN & REGISTER) -->
<div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-3">

      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="authTitle">
            <i class="fa-solid fa-right-to-bracket text-danger me-2"></i> Login Akun
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <!-- FORM LOGIN -->
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Username atau Email</label>
            <input id="loginIdentifier" class="form-control" placeholder="@username atau email" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input id="loginPassword" type="password" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-danger w-100 fw-bold mt-2" id="btnLoginSubmit">Masuk</button>

          <div class="text-center mt-3">
            <small>Belum punya akun? <a href="javascript:void(0)" onclick="toggleAuth('register')" class="text-warning fw-bold">Daftar sekarang</a></small>
          </div>
        </form>

        <!-- FORM REGISTER -->
        <form id="registerForm" class="d-none">
          <div class="mb-3">
            <label class="form-label">Nama Lengkap</label>
            <input id="regName" class="form-control" placeholder="Nama Lengkap" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Username</label>
            <input id="regUsername" class="form-control" placeholder="contoh: wota48" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input id="regEmail" type="email" class="form-control" placeholder="email@domain.com" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input id="regPassword" type="password" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-warning text-dark w-100 fw-bold mt-2" id="btnRegSubmit">Buat Akun</button>

          <div class="text-center mt-3">
            <small>Sudah punya akun? <a href="javascript:void(0)" onclick="toggleAuth('login')" class="text-danger fw-bold">Login</a></small>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>

<!-- PLAYER MODAL -->
<div class="modal fade" id="playerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">

      <div class="modal-header bg-dark">
        <h6 class="modal-title text-white" id="playerTitle">Streaming Player</h6>

      <div class="modal-body p-0">
        <div class="row g-0">
          <div class="col-lg-8">

              <iframe id="streamIframe" allowfullscreen allow="autoplay"></iframe>
            </div>

          <div class="col-lg-4">

              <i class="fa-solid fa-comments text-danger me-2"></i>Live Chat
            </div>
            <div class="chat-box p-3" id="chatContainer"></div>
            <form class="p-2 bg-dark d-flex gap-2" onsubmit="sendMessage(event)">
              <input id="chatInput" class="form-control" placeholder="Tulis pesan..." required>
              <button type="submit" class="btn btn-danger"><i class="fa-solid fa-paper-plane"></i></button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* =========================================
   1. FIREBASE CONFIG
========================================= */
const firebaseConfig = {
  apiKey: "AIzaSyAnqW79drGUG_0jfqJaXOqy0uxPzoZJz-M",
  authDomain: "fans48-app.firebaseapp.com",
  databaseURL: "https://fans48-app-default-rtdb.firebaseio.com",
  projectId: "fans48-app",
  storageBucket: "fans48-app.firebasestorage.app",
  messagingSenderId: "44407114480",
  appId: "1:44407114480:web:1ec3875a60c53d68455035",
  measurementId: "G-K6TG962WQ6"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

/* =========================================
   2. GLOBAL STATE
========================================= */
const DEFAULT_SUPERADMIN = {
    email: "admin@fans48.com",
    username: "@superadmin",
    name: "Super Admin",
    password: "admin123",
    role: "superadmin",
    cash: 999999,
    unlockedShows: []
};

const DEFAULT_THEATER_LIST = [
    {
        id: "th-1",
        setlist: "Cara Meminum Ramune",
        team: "JKT48 New Era",
        date: "Hari Ini",
        time: "19:00 WIB",
        category: "live",
        viewers: "14.2k",
        price: 1,
        embedUrl: "https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1"
    },
    {
        id: "th-2",
        setlist: "Itadaki Love",
        team: "JKT48 New Era",
        date: "Besok",
        time: "19:00 WIB",
        category: "upcoming",
        viewers: "-",
        price: 1,
        embedUrl: "https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1"
    }
];

let usersList = [];
let theaterList = [];
let redeemCodes = [];
let currentUser = JSON.parse(localStorage.getItem("fans48_session")) || null;
let currentPage = "home";

let settings = JSON.parse(localStorage.getItem("fans48_settings")) || {
    theme: "dark"
};

const members = [
    { stageName: "Freya", fullName: "Freyana Jayawardana", team: "New Era", img: "https://via.placeholder.com/300x400/e60012/FFFFFF?text=Freya" },
    { stageName: "Christy", fullName: "Angelina Christy", team: "New Era", img: "https://via.placeholder.com/300x400/e60012/FFFFFF?text=Christy" }
];

let authModal, playerModal;

/* =========================================
   3. INITIALIZATION
========================================= */
document.addEventListener("DOMContentLoaded", () => {
    authModal = new bootstrap.Modal(document.getElementById("authModal"));
    playerModal = new bootstrap.Modal(document.getElementById("playerModal"));

    applySettings();
    updateAuthUI();
    renderPage('home');
    syncOnlineDatabase();
});

function syncOnlineDatabase() {
    db.ref('users').on('value', (snapshot) => {
        const data = snapshot.val();
        usersList = data ? Object.values(data) : [];

        const adminExists = usersList.some(u => u.username === "@superadmin");
        if (!adminExists) {
            db.ref('users/superadmin').set(DEFAULT_SUPERADMIN);
        }

        if (currentUser) {
            const updatedMe = usersList.find(u => u.username.toLowerCase() === currentUser.username.toLowerCase());
            if (updatedMe) {
                currentUser = updatedMe;
                localStorage.setItem("fans48_session", JSON.stringify(currentUser));
            }
        }

        updateAuthUI();
        if (currentPage === "admin") renderPage("admin");
    });

    db.ref('theater').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            theaterList = Object.values(data);
        } else {
            DEFAULT_THEATER_LIST.forEach(t => db.ref('theater/' + t.id).set(t));
        }
        if (currentPage === "theater" || currentPage === "home") renderPage(currentPage);
    });

    db.ref('redeemCodes').on('value', (snapshot) => {
        const data = snapshot.val();
        redeemCodes = data ? Object.values(data) : [];
        if (currentPage === "admin" || currentPage === "topup") renderPage(currentPage);
    });
}

function makeSafeKey(key) {
    return key.replace(/[^a-zA-Z0-9]/g, "_");
}

function saveUserToFirebase(userObj) {
    const key = makeSafeKey(userObj.username);
    return db.ref('users/' + key).set(userObj);
}

/* =========================================
   4. AUTHENTICATION & MODAL CONTROLLER
========================================= */
function openAuth() {
    toggleAuth("login");
    authModal.show();
}

function toggleAuth(type) {
    const login = document.getElementById("loginForm");
    const register = document.getElementById("registerForm");
    const title = document.getElementById("authTitle");

    if (type === "register") {
        login.classList.add("d-none");
        register.classList.remove("d-none");
        title.innerHTML = '<i class="fa-solid fa-user-plus text-warning me-2"></i>Daftar Akun';
    } else {
        register.classList.add("d-none");
        login.classList.remove("d-none");
        title.innerHTML = '<i class="fa-solid fa-right-to-bracket text-danger me-2"></i>Login Akun';
    }
}

document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const identifier = document.getElementById("loginIdentifier").value.trim().toLowerCase();
    const password = document.getElementById("loginPassword").value;

    const user = usersList.find(u =>
        (u.email.toLowerCase() === identifier ||
         u.username.toLowerCase() === identifier ||
         u.username.toLowerCase() === "@" + identifier.replace("@", "")) && u.password === password
    );

    if (!user) {
        toast("Username/email atau password salah!", "error");
        return;
    }

    currentUser = user;
    localStorage.setItem("fans48_session", JSON.stringify(currentUser));
    updateAuthUI();
    authModal.hide();
    toast("Login berhasil. Selamat datang " + user.name + "!", "success");
    renderPage(currentPage);
});

document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const name = document.getElementById("regName").value.trim();
    let username = document.getElementById("regUsername").value.trim().toLowerCase();
    const email = document.getElementById("regEmail").value.trim().toLowerCase();
    const password = document.getElementById("regPassword").value;

    if (!username.startsWith("@")) username = "@" + username;

    if (usersList.some(u => u.username.toLowerCase() === username)) {
        toast("Username sudah digunakan!", "error");
        return;
    }

    if (usersList.some(u => u.email.toLowerCase() === email)) {
        toast("Email sudah terdaftar!", "error");
        return;
    }

    const newUser = {
        name: name,
        username: username,
        email: email,
        password: password,
        role: "pelanggan",
        cash: 0,
        unlockedShows: []
    };

    saveUserToFirebase(newUser).then(() => {
        currentUser = newUser;
        localStorage.setItem("fans48_session", JSON.stringify(currentUser));
        updateAuthUI();
        authModal.hide();
        toast("Akun berhasil dibuat!", "success");
        renderPage("home");
    }).catch(err => {
        toast("Gagal mendaftar: " + err.message, "error");
    });
});

function logout() {
    currentUser = null;
    localStorage.removeItem("fans48_session");
    updateAuthUI();
    renderPage("home");
    toast("Berhasil keluar.", "success");
}

/* =========================================
   5. RENDER UI & ROUTING
========================================= */
function updateAuthUI() {
    const area = document.getElementById("userArea");
    const adminNav = document.getElementById("nav-admin-item");

    if (currentUser && (currentUser.role === "superadmin" || currentUser.role === "admin")) {
        adminNav.classList.remove("d-none");
    } else {
        adminNav.classList.add("d-none");
    }

    if (!currentUser) {
        area.innerHTML = `
        <button class="btn btn-outline-danger fw-bold" onclick="openAuth()">
            <i class="fa-solid fa-right-to-bracket me-1"></i> Masuk / Daftar
        </button>`;
        return;
    }

    area.innerHTML = `
    <div class="cash-badge" onclick="renderPage('topup')">
        <i class="fa-solid fa-coins me-1"></i>
        ${(currentUser.cash || 0).toLocaleString()} Cash
    </div>

    <div class="dropdown">
        <button class="btn btn-dark border-secondary dropdown-toggle" data-bs-toggle="dropdown">
            <i class="fa-solid fa-user-circle text-danger me-1"></i>
            ${escapeHTML(currentUser.name)}
        </button>

        <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
            <li><span class="dropdown-item-text small text-muted">${escapeHTML(currentUser.username)}</span></li>
            <li><hr class="dropdown-divider"></li>
