<!-- Bootstrap & FontAwesome -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --primary-color:#e60012;
    --primary-glow:rgba(230,0,18,.4);
    --dark-bg:#0b0c10;
    --card-bg:#151821;
    --card-border:#262b3a;
    --text-color:#f1f1f1;
    --muted-color:#a0a5b5;
    --accent-gold:#ffb703;
}

body {
    background:var(--dark-bg);
    color:var(--text-color);
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    transition:.3s;
}

body.light-mode {
    --dark-bg:#f3f4f6;
    --card-bg:#ffffff;
    --card-border:#d9dce3;
    --text-color:#171717;
    --muted-color:#626975;
}

body.light-mode .navbar {
    background:rgba(255,255,255,.9);
}

body.light-mode .navbar-brand,
body.light-mode .card,
body.light-mode .fw-bold,
body.light-mode h1,
body.light-mode h2,
body.light-mode h3,
body.light-mode h4,
body.light-mode h5,
body.light-mode h6 {
    color:var(--text-color)!important;
}

body.light-mode .form-control,
body.light-mode .form-select {
    background:#fff!important;
    color:#111!important;
}

body.light-mode .dropdown-menu {
    background:#fff!important;
}

body.light-mode .dropdown-item {
    color:#111!important;
}

.navbar {
    background:rgba(11,12,16,.88);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--card-border);
}

.navbar-brand {
    font-weight:800;
    color:#fff!important;
}

.navbar-brand span {
    color:var(--primary-color);
}

.nav-link {
    color:var(--muted-color)!important;
    font-weight:600;
    padding:.5rem 1rem!important;
    border-radius:8px;
    transition: all 0.2s ease-in-out;
}

.nav-link:hover {
    color:#fff!important;
    background:rgba(255,255,255,.05);
}

.nav-link.active {
    color:#fff!important;
    background:linear-gradient(135deg,var(--primary-color),#b3000e);
}

#main-content {
    transition: opacity 0.25s ease-in-out, transform 0.25s ease-in-out;
    opacity: 1;
    transform: translateY(0);
}

#main-content.page-hidden {
    opacity: 0;
    transform: translateY(12px);
}

.card {
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:16px;
    color:var(--text-color);
    transition:.3s;
}

.card:hover {
    border-color:rgba(230,0,18,.5);
}

.hero-banner {
    background: linear-gradient(135deg, rgba(230,0,18,0.2), rgba(15,18,25,0.9)), var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 40px 30px;
}

.feature-card {
    height: 100%;
    transition: transform 0.3s ease, border-color 0.3s ease;
}

.feature-card:hover {
    transform: translateY(-6px);
    border-color: var(--primary-color);
}

.topup-card {
    position:relative;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:20px;
    text-align:center;
    transition:.3s;
    cursor:pointer;
}

.topup-card:hover {
    transform:translateY(-5px);
    border-color:var(--accent-gold);
}

.topup-card.popular {
    border-color:var(--primary-color);
}

.badge-popular {
    position:absolute;
    top:0;
    right:0;
    background:var(--primary-color);
    color:#fff;
    font-size:.7rem;
    font-weight:bold;
    padding:4px 12px;
    border-bottom-left-radius:10px;
}

.cash-badge {
    background:linear-gradient(135deg,#1e2330,#13161f);
    border:1px solid var(--accent-gold);
    color:var(--accent-gold);
    font-weight:700;
    padding:6px 16px;
    border-radius:30px;
    cursor:pointer;
}

.form-control,
.form-select {
    background:#11131a!important;
    border:1px solid var(--card-border)!important;
    color:#fff!important;
    border-radius:10px;
}

.form-control:focus,
.form-select:focus {
    border-color:var(--primary-color)!important;
    box-shadow:0 0 10px var(--primary-glow)!important;
}

.section-title {
    border-left:5px solid var(--primary-color);
    padding-left:12px;
    margin-bottom:24px;
}

.modal-content {
    background:var(--card-bg);
    color:var(--text-color);
    border:1px solid var(--card-border);
    border-radius:20px;
}

.badge-live {
    background:var(--primary-color);
    animation:pulse 1.5s infinite;
}

@keyframes pulse {
    0%,100% {opacity:1}
    50% {opacity:.6}
}

.member-img {
    height:240px;
    object-fit:cover;
}

.ratio-16x9 {
    position:relative;
    width:100%;
    padding-top:56.25%;
    background:#000;
}

.ratio-16x9 iframe {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
}

.chat-box {
    height:350px;
    overflow-y:auto;
    background:#0e1017;
}

.settings-color {
    width:42px;
    height:42px;
    border-radius:50%;
    border:3px solid transparent;
    cursor:pointer;
}

.settings-color.active {
    border-color:#fff;
    box-shadow:0 0 0 2px #000;
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- FIREBASE INTEGRATION MODULE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getAuth, 
    createUserWithEmailAndPassword, 
    signInWithEmailAndPassword, 
    signOut, 
    onAuthStateChanged 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { 
    getFirestore, 
    doc, 
    getDoc, 
    setDoc, 
    updateDoc, 
    collection, 
    onSnapshot, 
    addDoc, 
    deleteDoc, 
    query, 
    orderBy, 
    serverTimestamp,
    arrayUnion
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // =========================================
  // GANTI KONFIGURASI PROYEK FIREBASE ANDA
  // =========================================
  const firebaseConfig = {
    apiKey: "AIzaSyYOUR_API_KEY_HERE",
    authDomain: "your-app.firebaseapp.com",
    projectId: "your-app-id",
    storageBucket: "your-app.appspot.com",
    messagingSenderId: "1234567890",
    appId: "1:1234567890:web:abcdef123456"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // State Aplikasi
  let currentUserData = null;
  let firebaseUser = null;
  let theaterList = [];
  let redeemCodes = [];
  let usersList = [];
  let currentPage = "home";
  let activeChatUnsubscribe = null;
  let activeShowId = null;

  let settings = JSON.parse(localStorage.getItem("fans48_settings")) || {
    theme: "dark",
    fontColor: "#f1f1f1"
  };

  const members = [
    { stageName: "Freya", fullName: "Freyana Jayawardana", team: "New Era", img: "https://via.placeholder.com/300x400/e60012/FFFFFF?text=Freya" },
    { stageName: "Christy", fullName: "Angelina Christy", team: "New Era", img: "https://via.placeholder.com/300x400/e60012/FFFFFF?text=Christy" }
  ];

  let authModal;
  let playerModal;

  document.addEventListener("DOMContentLoaded", () => {
    authModal = new bootstrap.Modal(document.getElementById("authModal"));
    playerModal = new bootstrap.Modal(document.getElementById("playerModal"));

    applySettings();
    initRealtimeListeners();

    onAuthStateChanged(auth, async (user) => {
      firebaseUser = user;
      if (user) {
        await fetchUserData(user.uid);
      } else {
        currentUserData = null;
      }
      updateAuthUI();
      renderPage(currentPage);
    });
  });

  async function fetchUserData(uid) {
    const userDocRef = doc(db, "users", uid);
    const userSnap = await getDoc(userDocRef);
    if (userSnap.exists()) {
      currentUserData = { uid, ...userSnap.data() };
    }
  }

  function initRealtimeListeners() {
    // Synchronize Theater Shows
    onSnapshot(collection(db, "theater"), (snapshot) => {
      theaterList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      if (currentPage === "theater" || currentPage === "admin") {
        renderPage(currentPage);
      }
    });

    // Synchronize Redeem Codes
    onSnapshot(collection(db, "redeemCodes"), (snapshot) => {
      redeemCodes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      if (currentPage === "topup" || currentPage === "admin") {
        renderPage(currentPage);
      }
    });

    // Synchronize Users List
    onSnapshot(collection(db, "users"), (snapshot) => {
      usersList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      if (currentPage === "admin") {
        renderPage(currentPage);
      }
      if (firebaseUser) {
        const found = usersList.find(u => u.id === firebaseUser.uid);
        if (found) {
          currentUserData = found;
          updateAuthUI();
        }
      }
    });
  }

  // Exposed Global Window Methods
  window.openAuth = function() {
    window.toggleAuth("login");
    authModal.show();
  };

  window.toggleAuth = function(type) {
    const login = document.getElementById("loginForm");
    const register = document.getElementById("registerForm");
    const title = document.getElementById("authTitle");

    if (type === "register") {
      login.classList.add("d-none");
      register.classList.remove("d-none");
      title.innerHTML = '<i class="fa-solid fa-user-plus text-warning me-2"></i>Daftar Akun';
    } else {
      register.classList.add("d-none");
      login.classList.remove("d-none");
      title.innerHTML = '<i class="fa-solid fa-right-to-bracket text-danger me-2"></i>Login Akun';
    }
  };

  document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    try {
      await signInWithEmailAndPassword(auth, email, password);
      authModal.hide();
      toast("Login berhasil!", "success");
    } catch (error) {
      toast("Gagal login: " + error.message, "error");
    }
  });

  document.getElementById("registerForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const name = document.getElementById("regName").value.trim();
    let username = document.getElementById("regUsername").value.trim().toLowerCase();
    const email = document.getElementById("regEmail").value.trim().toLowerCase();
    const password = document.getElementById("regPassword").value;

    if (!username.startsWith("@")) username = "@" + username;

    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const uid = userCredential.user.uid;

      const newUser = {
        name,
        username,
        email,
        role: "pelanggan",
        cash: 0,
        unlockedShows: []
      };

      await setDoc(doc(db, "users", uid), newUser);
      currentUserData = { uid, ...newUser };

      authModal.hide();
      toast("Akun berhasil dibuat!", "success");
      renderPage("home");
    } catch (error) {
      toast("Gagal pendaftaran: " + error.message, "error");
    }
  });

  window.logout = async function() {
    try {
      await signOut(auth);
      toast("Berhasil keluar.", "success");
      renderPage("home");
    } catch (error) {
      toast("Gagal keluar: " + error.message, "error");
    }
  };

  function updateAuthUI() {
    const area = document.getElementById("userArea");
    const adminNav = document.getElementById("nav-admin-item");

    if (currentUserData && (currentUserData.role === "superadmin" || currentUserData.role === "admin")) {
      adminNav.classList.remove("d-none");
    } else {
      adminNav.classList.add("d-none");
    }

    if (!currentUserData) {
      area.innerHTML = `
      <button class="btn btn-outline-light fw-bold" onclick="window.openAuth()">
        <i class="fa-solid fa-right-to-bracket me-1"></i> Masuk / Daftar
      </button>`;
      return;
    }

    area.innerHTML = `
    <div class="cash-badge" onclick="window.renderPage('topup')">
      <i class="fa-solid fa-coins me-1"></i>
      ${currentUserData.cash.toLocaleString()} Cash
    </div>

    <div class="dropdown">
      <button class="btn btn-dark border-secondary dropdown-toggle" data-bs-toggle="dropdown">
        <i class="fa-solid fa-user-circle text-danger me-1"></i>
        ${escapeHTML(currentUserData.name)}
      </button>

      <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
        <li><span class="dropdown-item-text">${escapeHTML(currentUserData.username)}</span></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="#" onclick="window.renderPage('settings')"><i class="fa-solid fa-gear me-2"></i>Settings</a></li>
        ${canAccessAdmin() ? `<li><a class="dropdown-item text-danger fw-bold" href="#" onclick="window.renderPage('admin')"><i class="fa-solid fa-user-shield me-2"></i>Admin Panel</a></li>` : ""}
        <li><a class="dropdown-item text-danger" href="#" onclick="window.logout()"><i class="fa-solid fa-right-from-bracket me-2"></i>Keluar</a></li>
      </ul>
    </div>`;
  }

  function canAccessAdmin() {
    return currentUserData && (currentUserData.role === "superadmin" || currentUserData.role === "admin");
  }

  window.renderPage = function(page) {
    currentPage = page;
    document.querySelectorAll(".nav-link").forEach(x => x.classList.remove("active"));
    const activeNav = document.getElementById("nav-" + (page === "memberLive" ? "member-live" : page));
    if (activeNav) activeNav.classList.add("active");

    const container = document.getElementById("main-content");
    container.classList.add("page-hidden");

    setTimeout(() => {
      if (page === "home") container.innerHTML = getHomeHTML();
      else if (page === "theater") container.innerHTML = getTheaterHTML();
      else if (page === "memberLive") container.innerHTML = getMemberLiveHTML();
      else if (page === "member") container.innerHTML = getMemberHTML();
      else if (page === "topup") container.innerHTML = getTopupHTML();
      else if (page === "admin") {
        if (!canAccessAdmin()) {
          toast("Akses ditolak!", "error");
          window.renderPage("home");
          return;
        }
        container.innerHTML = getAdminHTML();
      } else if (page === "settings") container.innerHTML = getSettingsHTML();

      container.classList.remove("page-hidden");
    }, 200);
  };

  function getHomeHTML() {
    return `
    <div class="hero-banner mb-5 text-center text-lg-start">
      <div class="row align-items-center">
        <div class="col-lg-8">
          <h1 class="display-5 fw-bold mb-3">Selamat Datang di <span class="text-danger">Fans48</span> Hub</h1>
          <p class="lead text-muted mb-4">Platform terpadu streaming theater interaktif, siaran member, serta penukaran kode promo secara real-time melalui Firebase!</p>
          <div class="d-flex gap-3 justify-content-center justify-content-lg-start">
            <button class="btn btn-danger btn-lg fw-bold px-4" onclick="window.renderPage('theater')"><i class="fa-solid fa-play me-2"></i>Nonton Theater</button>
            <button class="btn btn-outline-warning btn-lg fw-bold px-4" onclick="window.renderPage('topup')"><i class="fa-solid fa-gift me-2"></i>Kode Redeem</button>
          </div>
        </div>
        <div class="col-lg-4 d-none d-lg-block text-center fs-1 text-danger">
          <i class="fa-solid fa-heart-pulse fa-5x opacity-75"></i>
        </div>
      </div>
    </div>
    
    <div class="section-title">
      <h3 class="fw-bold"><i class="fa-solid fa-star text-warning me-2"></i>Fitur Unggulan Fans48</h3>
    </div>

    <div class="row g-4">
      <div class="col-md-6 col-lg-4">
        <div class="card p-4 feature-card">
          <div class="text-danger fs-1 mb-3"><i class="fa-solid fa-building-columns"></i></div>
          <h5 class="fw-bold">Live & Replay Theater</h5>
          <p class="text-muted small">Akses siaran theater langsung dan rekaman pertunjukan secara instan.</p>
          <button class="btn btn-sm btn-outline-danger mt-auto align-self-start fw-bold" onclick="window.renderPage('theater')">Lihat Show <i class="fa-solid fa-arrow-right ms-1"></i></button>
        </div>
      </div>
      <div class="col-md-6 col-lg-4">
        <div class="card p-4 feature-card">
          <div class="text-danger fs-1 mb-3"><i class="fa-solid fa-tower-broadcast"></i></div>
          <h5 class="fw-bold">Live Streaming Member</h5>
          <p class="text-muted small">Saksikan siaran individu para member langsung dari aplikasi.</p>
          <button class="btn btn-sm btn-outline-danger mt-auto align-self-start fw-bold" onclick="window.renderPage('memberLive')">Tonton Live <i class="fa-solid fa-arrow-right ms-1"></i></button>
        </div>
      </div>
      <div class="col-md-6 col-lg-4">
        <div class="card p-4 feature-card">
          <div class="text-warning fs-1 mb-3"><i class="fa-solid fa-coins"></i></div>
          <h5 class="fw-bold">Top Up & Kode Redeem</h5>

  window.watchShow = async function(id) {
    if (!currentUserData) {
      toast("Silakan login terlebih dahulu!", "error");
      window.openAuth();
      return;
    }

    const unlocked = currentUserData.unlockedShows || [];

    if (unlocked.includes(id)) {
      window.openPlayer(id, "theater");
      return;
    }

    if (currentUserData.cash < 1) {
      toast("Cash tidak mencukupi!", "error");
      window.renderPage("topup");
      return;
    }

    try {
      const newCash = currentUserData.cash - 1;
      const userRef = doc(db, "users", currentUserData.uid);

      await updateDoc(userRef, {
        cash: newCash,
        unlockedShows: arrayUnion(id)
      });

      toast("Show berhasil dibuka!", "success");
      window.openPlayer(id, "theater");
    } catch (error) {
      toast("Gagal memproses transaksi: " + error.message, "error");
    }
  };

    const target = usersList.find(u => (u.username || "").toLowerCase() === username);

      await updateDoc(doc(db, "users", target.id), {
        cash: (target.cash || 0) + amount

    } catch (err) {

  window.redeemCode = async function(e) {
    e.preventDefault();
    if (!currentUserData) {
      toast("Silakan login dahulu!", "error");
      window.openAuth();
      return;
    }

    const inputCode = document.getElementById("userRedeemInput").value.trim().toUpperCase();
    const redeemObj = redeemCodes.find(r => r.code === inputCode);

    if (!redeemObj) {
      toast("Kode redeem tidak valid!", "error");
      return;
    }

    if ((redeemObj.usedCount || 0) >= redeemObj.quota) {
      toast("Kuota voucher habis!", "error");
      return;
    }

    const usedByArr = redeemObj.usedBy || [];
    if (usedByArr.includes(currentUserData.username)) {
      toast("Anda telah mengklaim voucher ini!", "error");
      return;
    }

    try {
      // Direct Firebase Update
      await updateDoc(doc(db, "users", currentUserData.uid), {
        cash: currentUserData.cash + redeemObj.cash
      });

      await updateDoc(doc(db, "redeemCodes", redeemObj.id), {
        usedCount: (redeemObj.usedCount || 0) + 1,
        usedBy: arrayUnion(currentUserData.username)
      });

      toast(`Berhasil klaim +${redeemObj.cash} Cash!`, "success");
    } catch (err) {
      toast("Gagal memproses voucher: " + err.message, "error");
    }
  };

    }
  };

  window.openPlayer = function(id, type) {
    activeShowId = id;
    let item = type === "theater" 
      ? theaterList.find(t => t.id === id) 
      : { setlist: "Freya Jayawardana - Live", embedUrl: "https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1" };

    if (!item) return;

    document.getElementById("playerTitle").innerText = item.setlist;
    document.getElementById("streamIframe").src = item.embedUrl;

    listenLiveChat(id);
    playerModal.show();
  };

  window.closePlayer = function() {
    document.getElementById("streamIframe").src = "";
    if (activeChatUnsubscribe) {
      activeChatUnsubscribe();
      activeChatUnsubscribe = null;
    }
  };

  function listenLiveChat(showId) {
    const chatBox = document.getElementById("chatContainer");
    chatBox.innerHTML = '<div class="text-muted small">Menghubungkan ke server obrolan...</div>';

    const chatQuery = query(collection(db, "theater", showId, "chats"), orderBy("timestamp", "asc"));

    if (activeChatUnsubscribe) activeChatUnsubscribe();

    activeChatUnsubscribe = onSnapshot(chatQuery, (snapshot) => {
      chatBox.innerHTML = "";
      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        const div = document.createElement("div");
        div.className = "small mb-2";
        div.innerHTML = `<span class="text-warning fw-bold">${escapeHTML(data.sender || "Anonim")}:</span> <span>${escapeHTML(data.message || "")}</span>`;
        chatBox.appendChild(div);
      });
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  }

  window.sendMessage = async function(e) {
    e.preventDefault();
    if (!currentUserData) {
      toast("Harap login untuk mengirim pesan!", "error");
      return;
    }

    const input = document.getElementById("chatInput");
    const message = input.value.trim();
    if (!message || !activeShowId) return;

    try {
      await addDoc(collection(db, "theater", activeShowId, "chats"), {
        sender: currentUserData.name,
        message,
        timestamp: serverTimestamp()
      });
      input.value = "";
    } catch (err) {
      toast("Gagal mengirim pesan: " + err.message, "error");
    }
  };

  function toast(message, type) {
    const el = document.createElement("div");
    el.className = "position-fixed bottom-0 end-0 p-3";
    el.style.zIndex = "99999";
    el.innerHTML = `<div class="alert ${type === "success" ? "alert-success" : "alert-danger"} shadow">${escapeHTML(message)}</div>`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  function escapeHTML(str) {
    return String(str).replace(/[&<>'"]/g, tag => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      "'": "&#39;",
      '"': "&quot;"
    }[tag]));
  }
</script>
