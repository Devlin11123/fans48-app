<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fans48 - Streaming & Top Up Cash Hub</title>

<!-- BOOTSTRAP 5 & FONTAWESOME -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
:root {
    --primary-color: #e60012;
    --dark-bg: #0b0c10;
    --card-bg: #151821;
    --card-border: #262b3a;
    --text-color: #ffffff;
    --accent-gold: #ffb703;
}

body {
    background-color: var(--dark-bg);
    color: var(--text-color);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
}

/* FIX STYLING MODAL & Z-INDEX */
.modal-backdrop {
    z-index: 1040 !important;
}

.modal {
    z-index: 1050 !important;
}

.modal-content {
    background-color: #151821 !important;
    color: #ffffff !important;
    border: 1px solid var(--card-border) !important;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}

.modal-header, .modal-footer {
    border-color: var(--card-border) !important;
}

/* NAVBAR FIX */
.navbar {
    background-color: #10121a !important;
    border-bottom: 1px solid var(--card-border);
    z-index: 1030;
}

.navbar-brand {
    font-weight: 800;
    color: #ffffff !important;
}

.navbar-brand span {
    color: var(--primary-color);
}

.nav-link {
    color: #a0a5b5 !important;
    font-weight: 600;
    padding: 0.5rem 1rem !important;
    border-radius: 8px;
    cursor: pointer;
}

.nav-link:hover {
    color: #ffffff !important;
    background: rgba(255,255,255,0.05);
}

.nav-link.active {
    color: #ffffff !important;
    background: var(--primary-color);
}

/* CARDS & UI ELEMENTS */
.card {
    background-color: var(--card-bg) !important;
    border: 1px solid var(--card-border) !important;
    color: #ffffff !important;
    border-radius: 14px;
}

.form-control, .form-select {
    background-color: #0b0c10 !important;
    border: 1px solid var(--card-border) !important;
    color: #ffffff !important;
}

.form-control:focus, .form-select:focus {
    border-color: var(--primary-color) !important;
    box-shadow: 0 0 0 0.25rem rgba(230,0,18,0.25) !important;
}

.cash-badge {
    background: #1e2330;
    border: 1px solid var(--accent-gold);
    color: var(--accent-gold);
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
}

.ratio-16x9 {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #000;
}

.ratio-16x9 iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

.chat-box {
    height: 320px;
    overflow-y: auto;
    background-color: #0b0c10;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg sticky-top navbar-dark">
<div class="container">

<a class="navbar-brand fs-4" href="javascript:void(0)" onclick="renderPage('home')">
    <i class="fa-solid fa-bolt text-danger me-2"></i>Fans<span>48</span>
</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"> 
    <span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav me-auto gap-1 mt-2 mt-lg-0">
        <li class="nav-item">
            <a class="nav-link active" id="nav-home" onclick="renderPage('home')"><i class="fa-solid fa-house me-1"></i> Home</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="nav-theater" onclick="renderPage('theater')"><i class="fa-solid fa-building-columns me-1"></i> Live Theater</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="nav-topup" onclick="renderPage('topup')"><i class="fa-solid fa-coins me-1 text-warning"></i> Top Up Cash</a>
        </li>
        <li class="nav-item d-none" id="nav-admin-item">
            <a class="nav-link text-danger fw-bold" id="nav-admin" onclick="renderPage('admin')"><i class="fa-solid fa-user-shield me-1"></i> Admin Panel</a>
        </li>
    </ul>

    <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0" id="userArea"></div>
</div>

</div>
</nav>

<!-- MAIN CONTENT CONTAINER -->
<div class="container my-4" id="main-content"></div>

<!-- AUTH MODAL -->
<div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-3">

      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="authTitle">
            <i class="fa-solid fa-right-to-bracket text-danger me-2"></i> Login Akun
        </h5>
        <button type="button" class="btn-close btn-close-white" onclick="closeAuthModal()"></button>
      </div>

      <div class="modal-body">
        <!-- FORM LOGIN -->
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Username atau Email</label>
            <input id="loginIdentifier" class="form-control" placeholder="@username atau email" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input id="loginPassword" type="password" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-danger w-100 fw-bold mt-2">Masuk</button>

          <div class="text-center mt-3">
            <small>Belum punya akun? <a href="javascript:void(0)" onclick="toggleAuth('register')" class="text-warning fw-bold">Daftar sekarang</a></small>
          </div>
        </form>

        <!-- FORM REGISTER -->
        <form id="registerForm" class="d-none">
          <div class="mb-3">
            <label class="form-label">Nama Lengkap</label>
            <input id="regName" class="form-control" placeholder="Nama Lengkap" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Username</label>
            <input id="regUsername" class="form-control" placeholder="contoh: wota48" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input id="regEmail" type="email" class="form-control" placeholder="email@domain.com" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input id="regPassword" type="password" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-warning text-dark w-100 fw-bold mt-2">Buat Akun</button>

          <div class="text-center mt-3">
            <small>Sudah punya akun? <a href="javascript:void(0)" onclick="toggleAuth('login')" class="text-danger fw-bold">Login</a></small>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>

<!-- PLAYER MODAL -->
<div class="modal fade" id="playerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content overflow-hidden">

      <div class="modal-header bg-dark">
        <h6 class="modal-title text-white" id="playerTitle">Streaming Player</h6>
        <button type="button" class="btn-close btn-close-white" onclick="closePlayer()"></button>
      </div>

      <div class="modal-body p-0">
        <div class="row g-0">
          <div class="col-lg-8">
            <div class="ratio-16x9">
              <iframe id="streamIframe" allowfullscreen allow="autoplay"></iframe>
            </div>
          </div>

          <div class="col-lg-4 d-flex flex-column" style="background:#151821;">
            <div class="p-2 bg-dark border-bottom text-white">
              <i class="fa-solid fa-comments text-danger me-2"></i>Live Chat
            </div>
            <div class="chat-box p-3 flex-grow-1" id="chatContainer"></div>
            <form class="p-2 bg-dark d-flex gap-2" onsubmit="sendMessage(event)">
              <input id="chatInput" class="form-control" placeholder="Tulis pesan..." required>
              <button type="submit" class="btn btn-danger"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* =========================================
   1. KONFIGURASI FIREBASE DATABASE
========================================= */
const firebaseConfig = {
  apiKey: "AIzaSyAnqW79drGUG_0jfqJaXOqy0uxPzoZJz-M",
  authDomain: "fans48-app.firebaseapp.com",
  databaseURL: "https://fans48-app-default-rtdb.firebaseio.com",
  projectId: "fans48-app",
  storageBucket: "fans48-app.firebasestorage.app",
  messagingSenderId: "44407114480",
  appId: "1:44407114480:web:1ec3875a60c53d68455035",
  measurementId: "G-K6TG962WQ6"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

/* =========================================
   2. DATA & GLOBAL STATE
========================================= */
const DEFAULT_SUPERADMIN = {
    email: "admin@fans48.com",
    username: "@superadmin",
    name: "Super Admin",
    password: "admin123",
    role: "superadmin",
    cash: 999999,
    unlockedShows: []
};

const DEFAULT_THEATER_LIST = [
    {
        id: "th-1",
        setlist: "Cara Meminum Ramune",
        team: "JKT48 New Era",
        date: "Hari Ini",
        time: "19:00 WIB",
        category: "live",
        viewers: "14.2k",
        price: 1,
        embedUrl: "https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1"
    },
    {
        id: "th-2",
        setlist: "Itadaki Love",
        team: "JKT48 New Era",
        date: "Besok",
        time: "19:00 WIB",
        category: "upcoming",
        viewers: "-",
        price: 1,
        embedUrl: "https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1"
    }
];

let usersList = [];
let theaterList = [];
let redeemCodes = [];
let currentUser = JSON.parse(localStorage.getItem("fans48_session")) || null;
let currentPage = "home";

/* =========================================
   3. INISIALISASI UTAMA
========================================= */
document.addEventListener("DOMContentLoaded", () => {
    updateAuthUI();
    renderPage('home');
    syncOnlineDatabase();
});

function syncOnlineDatabase() {
    db.ref('users').on('value', (snapshot) => {
        const data = snapshot.val();
        usersList = data ? Object.values(data) : [];

        const adminExists = usersList.some(u => u.username === "@superadmin");
        if (!adminExists) {
            db.ref('users/superadmin').set(DEFAULT_SUPERADMIN);
        }

        if (currentUser) {
            const updatedMe = usersList.find(u => u.username.toLowerCase() === currentUser.username.toLowerCase());
            if (updatedMe) {
                currentUser = updatedMe;
                localStorage.setItem("fans48_session", JSON.stringify(currentUser));
            }
        }

        updateAuthUI();
        if (currentPage === "admin") renderPage("admin");
    });

    db.ref('theater').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            theaterList = Object.values(data);
        } else {
            DEFAULT_THEATER_LIST.forEach(t => db.ref('theater/' + t.id).set(t));
        }
        if (currentPage === "theater" || currentPage === "home") renderPage(currentPage);
    });

    db.ref('redeemCodes').on('value', (snapshot) => {
        const data = snapshot.val();
        redeemCodes = data ? Object.values(data) : [];
        if (currentPage === "admin" || currentPage === "topup") renderPage(currentPage);
    });
}

function makeSafeKey(key) {
    return key.replace(/[^a-zA-Z0-9]/g, "_");
}

function saveUserToFirebase(userObj) {
    const key = makeSafeKey(userObj.username);
    return db.ref('users/' + key).set(userObj);
}

/* =========================================
   4. MODAL MANUAL CONTROLLER (MENCEGAH BUG UI)
========================================= */
function openAuthModal() {
    toggleAuth('login');
    const modalEl = document.getElementById('authModal');
    let modal = bootstrap.Modal.getInstance(modalEl);
    if (!modal) {
        modal = new bootstrap.Modal(modalEl);
    }
    modal.show();
}

function closeAuthModal() {
    const modalEl = document.getElementById('authModal');
    const modal = bootstrap.Modal.getInstance(modalEl);
    if (modal) {
        modal.hide();
    }
}

function toggleAuth(type) {
    const login = document.getElementById("loginForm");
    const register = document.getElementById("registerForm");
    const title = document.getElementById("authTitle");

    if (type === "register") {
        login.classList.add("d-none");
        register.classList.remove("d-none");
        title.innerHTML = '<i class="fa-solid fa-user-plus text-warning me-2"></i>Daftar Akun';
    } else {
        register.classList.add("d-none");
        login.classList.remove("d-none");
        title.innerHTML = '<i class="fa-solid fa-right-to-bracket text-danger me-2"></i>Login Akun';
    }
}

document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const identifier = document.getElementById("loginIdentifier").value.trim().toLowerCase();
    const password = document.getElementById("loginPassword").value;

    const user = usersList.find(u =>
        (u.email.toLowerCase() === identifier ||
         u.username.toLowerCase() === identifier ||
         u.username.toLowerCase() === "@" + identifier.replace("@", "")) && u.password === password
    );

    if (!user) {
        toast("Username/email atau password salah!", "error");
        return;
    }

    currentUser = user;
    localStorage.setItem("fans48_session", JSON.stringify(currentUser));
    updateAuthUI();
    closeAuthModal();
    toast("Login berhasil. Selamat datang " + user.name + "!", "success");
    renderPage(currentPage);
});

document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const name = document.getElementById("regName").value.trim();
    let username = document.getElementById("regUsername").value.trim().toLowerCase();
    const email = document.getElementById("regEmail").value.trim().toLowerCase();
    const password = document.getElementById("regPassword").value;

    if (!username.startsWith("@")) username = "@" + username;

    if (usersList.some(u => u.username.toLowerCase() === username)) {
        toast("Username sudah digunakan!", "error");
        return;
    }

    if (usersList.some(u => u.email.toLowerCase() === email)) {
        toast("Email sudah terdaftar!", "error");
        return;
    }

    const newUser = {
        name: name,
        username: username,
        email: email,
        password: password,
        role: "pelanggan",
        cash: 0,
        unlockedShows: []
    };

    saveUserToFirebase(newUser).then(() => {
        currentUser = newUser;
        localStorage.setItem("fans48_session", JSON.stringify(currentUser));
        updateAuthUI();
        closeAuthModal();
        toast("Akun berhasil dibuat!", "success");
        renderPage("home");
    }).catch(err => {
        toast("Gagal mendaftar: " + err.message, "error");
    });
});

function logout() {
    currentUser = null;
    localStorage.removeItem("fans48_session");
    updateAuthUI();
    renderPage("home");
    toast("Berhasil keluar.", "success");
}

/* =========================================
   5. ROUTING & TEMPLATE RENDERING
========================================= */
function updateAuthUI() {
    const area = document.getElementById("userArea");
    const adminNav = document.getElementById("nav-admin-item");

    if (currentUser && (currentUser.role === "superadmin" || currentUser.role === "admin")) {
        adminNav.classList.remove("d-none");
    } else {
        adminNav.classList.add("d-none");
    }

    if (!currentUser) {
        area.innerHTML = `
        <button class="btn btn-danger fw-bold px-3" onclick="openAuthModal()">
            <i class="fa-solid fa-right-to-bracket me-1"></i> Masuk / Daftar
        </button>`;
        return;
    }

    area.innerHTML = `
    <div class="cash-badge" onclick="renderPage('topup')">
        <i class="fa-solid fa-coins me-1"></i>
        ${(currentUser.cash || 0).toLocaleString()} Cash
    </div>

    <div class="dropdown">
        <button class="btn btn-dark border-secondary dropdown-toggle text-white" data-bs-toggle="dropdown">
            <i class="fa-solid fa-user-circle text-danger me-1"></i>
            ${escapeHTML(currentUser.name)}
        </button>

        <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
            <li><span class="dropdown-item-text small text-muted">${escapeHTML(currentUser.username)}</span></li>
            <li><hr class="dropdown-divider"></li>
            ${canAccessAdmin() ? `<li><a class="dropdown-item text-danger fw-bold" onclick="renderPage('admin')"><i class="fa-solid fa-user-shield me-2"></i>Admin Panel</a></li>` : ""}
            <li><a class="dropdown-item text-danger" onclick="logout()"><i class="fa-solid fa-right-from-bracket me-2"></i>Keluar</a></li>
        </ul>
    </div>`;
}

function canAccessAdmin() {
    return currentUser && (currentUser.role === "superadmin" || currentUser.role === "admin");
}

function renderPage(page) {
    currentPage = page;
    document.querySelectorAll(".nav-link").forEach(x => x.classList.remove("active"));
    const activeNav = document.getElementById("nav-" + page);
    if (activeNav) activeNav.classList.add("active");

    const container = document.getElementById("main-content");

    if (page === "home") container.innerHTML = getHomeHTML();
    else if (page === "theater") container.innerHTML = getTheaterHTML();
    else if (page === "topup") container.innerHTML = getTopupHTML();
    else if (page === "admin") {
        if (!canAccessAdmin()) {
            toast("Akses ditolak!", "error");
            renderPage("home");
            return;
        }
        container.innerHTML = getAdminHTML();
    }
}

function getHomeHTML() {
    return `
    <div class="p-5 mb-4 rounded-3 text-center text-lg-start" style="background: linear-gradient(135deg, rgba(230,0,18,0.2), #151821); border: 1px solid var(--card-border);">
        <div class="container-fluid py-3">
            <h1 class="display-5 fw-bold text-white mb-3">Selamat Datang di <span class="text-danger">Fans48</span></h1>
            <p class="col-md-8 fs-5 text-muted">Platform terpadu untuk menonton tayangan langsung setlist theater idol favorit Anda.</p>
            <div class="d-flex gap-2">
                <button class="btn btn-danger btn-lg fw-bold px-4" onclick="renderPage('theater')"><i class="fa-solid fa-play me-2"></i>Nonton Theater</button>
                <button class="btn btn-outline-warning btn-lg fw-bold px-4" onclick="renderPage('topup')"><i class="fa-solid fa-gift me-2"></i>Redeem Code</button>
            </div>
        </div>
    </div>`;
}

function getTheaterHTML() {
    return `
    <div class="border-start border-4 border-danger ps-3 mb-4">
        <h3 class="fw-bold mb-0">Live & Replay Theater</h3>
        <small class="text-muted">Gunakan 1 Cash untuk membukanya secara permanen.</small>
    </div>
    <div class="row g-4">
        ${theaterList.length ? theaterList.map(renderTheaterCard).join("") : '<p class="text-muted">Memuat data show...</p>'}
    </div>`;
}

function renderTheaterCard(t) {
    const unlocked = currentUser && currentUser.unlockedShows && currentUser.unlockedShows.includes(t.id);
    return `
    <
