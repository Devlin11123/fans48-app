<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fans48 - Streaming & Top Up Cash Hub</title>

<!-- BOOTSTRAP 5 & FONTAWESOME -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- FIREBASE SDK COMPAT -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
:root {
    --primary-color: #e60012;
    --dark-bg: #0b0c10;
    --card-bg: #151821;
    --card-border: #262b3a;
    --text-color: #ffffff;
    --accent-gold: #ffb703;
}

body {
    background-color: var(--dark-bg);
    color: var(--text-color);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
}

.modal-content {
    background-color: #151821 !important;
    color: #ffffff !important;
    border: 1px solid var(--card-border) !important;
    border-radius: 16px;
}

.modal-header, .modal-footer {
    border-color: var(--card-border) !important;
}

.navbar {
    background-color: #10121a !important;
    border-bottom: 1px solid var(--card-border);
}

.navbar-brand { font-weight: 800; color: #ffffff !important; }
.navbar-brand span { color: var(--primary-color); }

.nav-link {
    color: #a0a5b5 !important;
    font-weight: 600;
    padding: 0.5rem 1rem !important;
    border-radius: 8px;
    cursor: pointer;
}

.nav-link:hover, .nav-link.active {
    color: #ffffff !important;
    background: var(--primary-color);
}

.card {
    background-color: var(--card-bg) !important;
    border: 1px solid var(--card-border) !important;
    color: #ffffff !important;
    border-radius: 14px;
}

.form-control, .form-select {
    background-color: #0b0c10 !important;
    border: 1px solid var(--card-border) !important;
    color: #ffffff !important;
}

.form-control:focus, .form-select:focus {
    border-color: var(--primary-color) !important;
    box-shadow: 0 0 0 0.25rem rgba(230,0,18,0.25) !important;
}

.cash-badge {
    background: #1e2330;
    border: 1px solid var(--accent-gold);
    color: var(--accent-gold);
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
}

.ratio-16x9 {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #000;
}

.ratio-16x9 iframe {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%; border: 0;
}

.chat-box {
    height: 320px;
    overflow-y: auto;
    background-color: #0b0c10;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg sticky-top navbar-dark">
<div class="container">
    <a class="navbar-brand fs-4" href="javascript:void(0)" onclick="renderPage('home')">
        <i class="fa-solid fa-bolt text-danger me-2"></i>Fans<span>48</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"> 
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto gap-1 mt-2 mt-lg-0">
            <li class="nav-item">
                <a class="nav-link active" id="nav-home" onclick="renderPage('home')"><i class="fa-solid fa-house me-1"></i> Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="nav-theater" onclick="renderPage('theater')"><i class="fa-solid fa-building-columns me-1"></i> Live Theater</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="nav-topup" onclick="renderPage('topup')"><i class="fa-solid fa-coins me-1 text-warning"></i> Top Up Cash</a>
            </li>
            <li class="nav-item d-none" id="nav-admin-item">
                <a class="nav-link text-danger fw-bold" id="nav-admin" onclick="renderPage('admin')"><i class="fa-solid fa-user-shield me-1"></i> Admin Panel</a>
            </li>
        </ul>

        <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0" id="userArea"></div>
    </div>
</div>
</nav>

<!-- MAIN CONTAINER -->
<div class="container my-4" id="main-content"></div>

<!-- AUTH MODAL -->
<div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-3">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="authTitle"><i class="fa-solid fa-right-to-bracket text-danger me-2"></i> Login Akun</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <!-- LOGIN -->
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Username / Email</label>
            <input id="loginIdentifier" class="form-control" placeholder="@username atau email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input id="loginPassword" type="password" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-danger w-100 fw-bold mt-2">Masuk</button>
          <div class="text-center mt-3">
            <small>Belum punya akun? <a href="javascript:void(0)" onclick="toggleAuth('register')" class="text-warning fw-bold">Daftar sekarang</a></small>
          </div>
        </form>

        <!-- REGISTER -->
        <form id="registerForm" class="d-none">
          <div class="mb-3">
            <label class="form-label">Nama Lengkap</label>
            <input id="regName" class="form-control" placeholder="Nama Lengkap" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input id="regUsername" class="form-control" placeholder="contoh: wota48" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input id="regEmail" type="email" class="form-control" placeholder="email@domain.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input id="regPassword" type="password" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-warning text-dark w-100 fw-bold mt-2">Buat Akun</button>
          <div class="text-center mt-3">
            <small>Sudah punya akun? <a href="javascript:void(0)" onclick="toggleAuth('login')" class="text-danger fw-bold">Login</a></small>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- PLAYER MODAL -->
<div class="modal fade" id="playerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content overflow-hidden">
      <div class="modal-header bg-dark">
        <h6 class="modal-title text-white" id="playerTitle">Streaming Player</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" onclick="closePlayer()"></button>
      </div>
      <div class="modal-body p-0">
        <div class="row g-0">
          <div class="col-lg-8">
            <div class="ratio-16x9">
              <iframe id="streamIframe" allowfullscreen allow="autoplay"></iframe>
            </div>
          </div>
          <div class="col-lg-4 d-flex flex-column" style="background:#151821;">
            <div class="p-2 bg-dark border-bottom text-white">
              <i class="fa-solid fa-comments text-danger me-2"></i>Live Chat
            </div>
            <div class="chat-box p-3 flex-grow-1" id="chatContainer"></div>
            <form class="p-2 bg-dark d-flex gap-2" onsubmit="sendMessage(event)">
              <input id="chatInput" class="form-control" placeholder="Tulis pesan..." required>
              <button type="submit" class="btn btn-danger"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* FIREBASE CONFIGURATION */
const firebaseConfig = {
  apiKey: "AIzaSyCEZev9CKBLXgNcDSlpD4wjDMomzLIlCYc",
  authDomain: "fans-48-project.firebaseapp.com",
  databaseURL: "https://fans-48-project-default-rtdb.firebaseio.com",
  projectId: "fans-48-project",
  storageBucket: "fans-48-project.firebasestorage.app",
  messagingSenderId: "947248601631",
  appId: "1:947248601631:web:9d846644ee439cbd8fd32a",
  measurementId: "G-519WHGEDS9"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* DEFAULT MOCK DATA (GAK AKAN HILANG) */
const DEFAULT_SUPERADMIN = {
    email: "admin@fans48.com",
    username: "@superadmin",
    name: "Super Admin",
    password: "admin123",
    role: "superadmin",
    cash: 999999,
    unlockedShows: []
};

const DEFAULT_THEATER_LIST = [
    { id: "th-1", setlist: "Cara Meminum Ramune", team: "JKT48 New Era", date: "Hari Ini", time: "19:00 WIB", category: "live", viewers: "14.2k", embedUrl: "https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1" },
    { id: "th-2", setlist: "Aturan Anti Cinta", team: "JKT48 New Era", date: "Besok", time: "19:00 WIB", category: "upcoming", viewers: "-", embedUrl: "https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1" }
];

let usersList = [];
let theaterList = DEFAULT_THEATER_LIST;
let currentUser = JSON.parse(localStorage.getItem("fans48_session")) || null;
let currentPage = "home";

/* INIT & SYNC FIREBASE */
document.addEventListener("DOMContentLoaded", () => {
    updateAuthUI();
    renderPage('home');
    syncFirebase();
});

function syncFirebase() {
    // Sync Users
    db.ref('users').on('value', (snapshot) => {
        const data = snapshot.val();
        usersList = data ? Object.values(data) : [];

        // Buat Superadmin default jika belum ada
        if (!usersList.some(u => u.username === "@superadmin")) {
            db.ref('users/superadmin').set(DEFAULT_SUPERADMIN);
        }

        if (currentUser) {
            const myData = usersList.find(u => u.username.toLowerCase() === currentUser.username.toLowerCase());
            if (myData) {
                currentUser = myData;
                localStorage.setItem("fans48_session", JSON.stringify(currentUser));
            }
        }

        updateAuthUI();
        if (currentPage === "admin") renderPage("admin");
    });

    // Sync Theater List
    db.ref('theater').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            theaterList = Object.values(data);
        } else {
            DEFAULT_THEATER_LIST.forEach(t => db.ref('theater/' + t.id).set(t));
        }
        if (currentPage === "theater" || currentPage === "home") renderPage(currentPage);
    });
}

/* AUTHENTICATION SYSTEM */
function openAuthModal() {
    toggleAuth('login');
    new bootstrap.Modal(document.getElementById('authModal')).show();
}

function toggleAuth(type) {
    if (type === "register") {
        document.getElementById("loginForm").classList.add("d-none");
        document.getElementById("registerForm").classList.remove("d-none");
        document.getElementById("authTitle").innerHTML = '<i class="fa-solid fa-user-plus text-warning me-2"></i>Daftar Akun';
    } else {
        document.getElementById("registerForm").classList.add("d-none");
        document.getElementById("loginForm").classList.remove("d-none");
        document.getElementById("authTitle").innerHTML = '<i class="fa-solid fa-right-to-bracket text-danger me-2"></i>Login Akun';
    }
}

document.getElementById("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const id = document.getElementById("loginIdentifier").value.trim().toLowerCase();
    const pass = document.getElementById("loginPassword").value;

    const user = usersList.find(u => 
        (u.email.toLowerCase() === id || u.username.toLowerCase() === id || u.username.toLowerCase() === "@" + id.replace("@","")) && u.password === pass
    );

    if (!user) return alert("Username/email atau password salah!");

    currentUser = user;
    localStorage.setItem("fans48_session", JSON.stringify(currentUser));
    updateAuthUI();
    bootstrap.Modal.getInstance(document.getElementById('authModal')).hide();
    renderPage(currentPage);
});

document.getElementById("registerForm").addEventListener("submit", (e) => {
    e.preventDefault();
    let uname = document.getElementById("regUsername").value.trim().toLowerCase();
    if (!uname.startsWith("@")) uname = "@" + uname;

    if (usersList.some(u => u.username.toLowerCase() === uname)) return alert("Username sudah digunakan!");

    const newUser = {
        name: document.getElementById("regName").value.trim(),
        username: uname,
        email: document.getElementById("regEmail").value.trim().toLowerCase(),
        password: document.getElementById("regPassword").value,
        role: "pelanggan",
        cash: 0,
        unlockedShows: []
    };

    const safeKey = uname.replace(/[^a-zA-Z0-9]/g, "_");
    db.ref('users/' + safeKey).set(newUser).then(() => {
        currentUser = newUser;
        localStorage.setItem("fans48_session", JSON.stringify(currentUser));
        updateAuthUI();
        bootstrap.Modal.getInstance(document.getElementById('authModal')).hide();
        renderPage("home");
    });
});

function logout() {
    currentUser = null;
    localStorage.removeItem("fans48_session");
    updateAuthUI();
    renderPage("home");
}

/* NAVBAR & UI STATE */
function updateAuthUI() {
    const area = document.getElementById("userArea");
    const adminNav = document.getElementById("nav-admin-item");

    // TAMPILKAN TOMBOL ADMIN KALAU USER ADALAH ADMIN/SUPERADMIN
    if (currentUser && (currentUser.role === "superadmin" || currentUser.role === "admin")) {
        adminNav.classList.remove("d-none");
    } else {
        adminNav.classList.add("d-none");
    }

    if (!currentUser) {
        area.innerHTML = `<button class="btn btn-danger fw-bold px-3" onclick="openAuthModal()"><i class="fa-solid fa-right-to-bracket me-1"></i> Masuk / Daftar</button>`;
        return;
    }

    area.innerHTML = `
    <div class="cash-badge" onclick="renderPage('topup')"><i class="fa-solid fa-coins me-1"></i> ${(currentUser.cash || 0).toLocaleString()} Cash</div>
    <div class="dropdown">
        <button class="btn btn-dark border-secondary dropdown-toggle text-white" data-bs-toggle="dropdown">
            <i class="fa-solid fa-user-circle text-danger me-1"></i> ${currentUser.name}
        </button>
        <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
            <li><span class="dropdown-item-text small text-muted">${currentUser.username} (${currentUser.role || 'user'})</span></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" onclick="renderPage('settings')"><i class="fa-solid fa-gear me-2"></i>Pengaturan Akun</a></li>
            ${(currentUser.role === 'admin' || currentUser.role === 'superadmin') ? `<li><a class="dropdown-item text-danger fw-bold" onclick="renderPage('admin')"><i class="fa-solid fa-user-shield me-2"></i>Admin Panel</a></li>` : ''}
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" onclick="logout()"><i class="fa-solid fa-right-from-bracket me-2"></i>Keluar</a></li>
        </ul>
    </div>`;
}

/* PAGE ROUTER */
function renderPage(page) {
    currentPage = page;
    document.querySelectorAll(".nav-link").forEach(x => x.classList.remove("active"));
    const nav = document.getElementById("nav-" + page);
    if (nav) nav.classList.add("active");

    const c = document.getElementById("main-content");

    if (page === "home") {
        c.innerHTML = `
        <div class="p-5 mb-4 rounded-3" style="background: linear-gradient(135deg, rgba(230,0,18,0.2), #151821); border: 1px solid var(--card-border);">
            <h1 class="fw-bold text-white mb-3">Selamat Datang di <span class="text-danger">Fans48</span></h1>
            <p class="text-muted fs-5">Platform terpadu streaming setlist theater idol favorit Anda.</p>
            <button class="btn btn-danger btn-lg fw-bold px-4" onclick="renderPage('theater')"><i class="fa-solid fa-play me-2"></i>Nonton Theater</button>
        </div>`;
    } 
    else if (page === "theater") {
        c.innerHTML = `
        <h3 class="fw-bold mb-3 border-start border-4 border-danger ps-3">Live & Replay Theater</h3>
        <div class="row g-4">${theaterList.map(t => {
            const unlocked = currentUser && currentUser.unlockedShows && currentUser.unlockedShows.includes(t.id);
            return `
            <div class="col-md-6">
                <div class="card p-3 h-100">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="badge ${t.category === "live" ? "bg-danger" : "bg-info text-dark"}">${t.category.toUpperCase()}</span>
                        <span class="text-muted small">${t.date} • ${t.time}</span>
                    </div>
                    <h4 class="fw-bold text-white">${t.setlist}</h4>
                    <p class="text-danger fw-bold small">${t.team}</p>
                    <div class="mt-auto pt-3 border-top border-secondary d-flex justify-content-between align-items-center">
                        <span class="text-muted small"><i class="fa-solid fa-eye me-1"></i>${t.viewers}</span>
                        ${unlocked 
                            ? `<button class="btn btn-success btn-sm fw-bold" onclick="openPlayer('${t.id}')"><i class="fa-solid fa-play me-1"></i> Putar Show</button>`
                            : `<button class="btn btn-danger btn-sm fw-bold" onclick="buyShow('${t.id}')"><i class="fa-solid fa-ticket me-1"></i> Buka 1 Cash</button>`
                        }
                    </div>
                </div>
            </div>`;
        }).join("")}</div>`;
    } 
    else if (page === "topup") {
        c.innerHTML = `
        <h3 class="fw-bold mb-3 border-start border-4 border-warning ps-3">Top Up Cash</h3>
        <div class="card p-4">
            <h5 class="text-warning fw-bold mb-3"><i class="fa-solid fa-coins me-2"></i>Pilih Paket Top Up</h5>
            <p class="text-muted">Isi saldo Cash kamu untuk membuka acara Live Theater eksklusif.</p>
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="card p-3 text-center border-warning">
                        <h4 class="fw-bold text-warning">5 Cash</h4>
                        <p class="mb-2">Rp 10.000</p>
                        <button class="btn btn-warning text-dark fw-bold btn-sm" onclick="addCash(5)">Beli Sekarang</button>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-3 text-center border-warning">
                        <h4 class="fw-bold text-warning">12 Cash</h4>
                        <p class="mb-2">Rp 20.000</p>
                        <button class="btn btn-warning text-dark fw-bold btn-sm" onclick="addCash(12)">Beli Sekarang</button>
                    </div>
                </div>
            </div>
        </div>`;
    } 
    else if (page === "settings") {
        c.innerHTML = `
        <h3 class="fw-bold mb-3 border-start border-4 border-primary ps-3">Pengaturan Akun</h3>
        <div class="card p-4">
            <h5 class="fw-bold mb-3"><i class="fa-solid fa-user-gear me-2"></i>Profil Saya</h5>
            <form onsubmit="updateProfile(event)">
                <div class="mb-3">
                    <label class="form-label">Nama Lengkap</label>
                    <input id="setNama" class="form-control" value="${currentUser ? currentUser.name : ''}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input class="form-control" value="${currentUser ? currentUser.email : ''}" disabled>
                </div>
                <button type="submit" class="btn btn-primary fw-bold">Simpan Perubahan</button>
            </form>
        </div>`;
    } 
    else if (page === "admin") {
        c.innerHTML = `
        <h3 class="fw-bold mb-3 border-start border-4 border-danger ps-3">Admin Panel</h3>
        <div class="card p-4 mb-4">
            <h5 class="text-danger fw-bold"><i class="fa-solid fa-users me-2"></i>Kelola User (Cloud Database)</h5>
            <div class="table-responsive">
                <table class="table table-dark mt-3 align-middle">
                    <thead><tr><th>Nama</th><th>Username</th><th>Cash</th><th>Role</th><th>Aksi Cash</th></tr></thead>
                    <tbody>${usersList.map(u => `
                        <tr>
                            <td>${u.name}</td>
                            <td class="text-warning">${u.username}</td>
                            <td class="fw-bold text-success">${u.cash || 0}</td>
                            <td><span class="badge ${u.role === 'superadmin' ? 'bg-danger' : (u.role === 'admin' ? 'bg-warning text-dark' : 'bg-secondary')}">${u.role || 'pelanggan'}</span></td>
                            <td>
                                <button class="btn btn-sm btn-outline-warning" onclick="adminGiveCash('${u.username}')">+5 Cash</button>
                            </td>
                        </tr>`).join("")}
                    </tbody>
                </table>
            </div>
        </div>`;
    }
}

/* ACTIONS */
function buyShow(id) {
    if (!currentUser) return openAuthModal();
    if ((currentUser.cash || 0) < 1) return renderPage("topup");

    if (!currentUser.unlockedShows) currentUser.unlockedShows = [];
    currentUser.cash--;
    currentUser.unlockedShows.push(id);

    const safeKey = currentUser.username.replace(/[^a-zA-Z0-9]/g, "_");
    db.ref('users/' + safeKey).set(currentUser).then(() => openPlayer(id));
}

function addCash(amount) {
    if (!currentUser) return openAuthModal();
    currentUser.cash = (currentUser.cash || 0) + amount;
    const safeKey = currentUser.username.replace(/[^a-zA-Z0-9]/g, "_");
    db.ref('users/' + safeKey).set(currentUser).then(() => alert("Berhasil menambah " + amount + " Cash!"));
}

function adminGiveCash(username) {
    const target = usersList.find(u => u.username === username);
    if (target) {
        target.cash = (target.cash || 0) + 5;
        const safeKey = username.replace(/[^a-zA-Z0-9]/g, "_");
        db.ref('users/' + safeKey).set(target);
    }
}

function updateProfile(e) {
    e.preventDefault();
    if (!currentUser) return;
    currentUser.name = document.getElementById("setNama").value;
    const safeKey = currentUser.username.replace(/[^a-zA-Z0-9]/g, "_");
    db.ref('users/' + safeKey).set(currentUser).then(() => alert("Profil berhasil diupdate!"));
}

function openPlayer(id) {
    let item = theaterList.find(t => t.id === id) || DEFAULT_THEATER_LIST[0];
    document.getElementById("playerTitle").innerText = item.setlist;
    document.getElementById("streamIframe").src = item.embedUrl;
    new bootstrap.Modal(document.getElementById('playerModal')).show();
}

function closePlayer() {
    document.getElementById("streamIframe").src = "";
}

function sendMessage(e) {
    e.preventDefault();
    if (!currentUser) return openAuthModal();
    const input = document.getElementById("chatInput");
    if (!input.value.trim()) return;

    const div = document.createElement("div");
    div.className = "small mb-2 text-white";
    div.innerHTML = `<span class="text-warning fw-bold">${currentUser.name}:</span> <span>${input.value}</span>`;
    document.getElementById("chatContainer").appendChild(div);
    input.value = "";
}
</script>
</body>
</html>
