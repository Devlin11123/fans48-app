<style>
:root {
    --primary-color:#e60012;
    --primary-glow:rgba(230,0,18,.4);
    --dark-bg:#0b0c10;
    --card-bg:#151821;
    --card-border:#262b3a;
    --text-color:#f1f1f1;
    --muted-color:#a0a5b5;
    --accent-gold:#ffb703;
}

body {
    background:var(--dark-bg);
    color:var(--text-color);
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    transition:.3s;
}

body.light-mode {
    --dark-bg:#f3f4f6;
    --card-bg:#ffffff;
    --card-border:#d9dce3;
    --text-color:#171717;
    --muted-color:#626975;
}

body.light-mode .navbar {
    background:rgba(255,255,255,.9);
}

body.light-mode .navbar-brand,
body.light-mode .card,
body.light-mode .fw-bold,
body.light-mode h1,
body.light-mode h2,
body.light-mode h3,
body.light-mode h4,
body.light-mode h5,
body.light-mode h6 {
    color:var(--text-color)!important;
}

body.light-mode .form-control,
body.light-mode .form-select {
    background:#fff!important;
    color:#111!important;
}

body.light-mode .dropdown-menu {
    background:#fff!important;
}

body.light-mode .dropdown-item {
    color:#111!important;
}

.navbar {
    background:rgba(11,12,16,.88);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--card-border);
}

.navbar-brand {
    font-weight:800;
    color:#fff!important;
}

.navbar-brand span {
    color:var(--primary-color);
}

.nav-link {
    color:var(--muted-color)!important;
    font-weight:600;
    padding:.5rem 1rem!important;
    border-radius:8px;
    transition: all 0.2s ease-in-out;
}

.nav-link:hover {
    color:#fff!important;
    background:rgba(255,255,255,.05);
}

.nav-link.active {
    color:#fff!important;
    background:linear-gradient(135deg,var(--primary-color),#b3000e);
}

#main-content {
    transition: opacity 0.25s ease-in-out, transform 0.25s ease-in-out;
    opacity: 1;
    transform: translateY(0);
}

#main-content.page-hidden {
    opacity: 0;
    transform: translateY(12px);
}

.card {
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:16px;
    color:var(--text-color);
    transition:.3s;
}

.card:hover {
    border-color:rgba(230,0,18,.5);
}

.hero-banner {
    background: linear-gradient(135deg, rgba(230,0,18,0.2), rgba(15,18,25,0.9)), var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 40px 30px;
}

.feature-card {
    height: 100%;
    transition: transform 0.3s ease, border-color 0.3s ease;
}

.feature-card:hover {
    transform: translateY(-6px);
    border-color: var(--primary-color);
}

.topup-card {
    position:relative;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:20px;
    text-align:center;
    transition:.3s;
    cursor:pointer;
}

.topup-card:hover {
    transform:translateY(-5px);
    border-color:var(--accent-gold);
}

.topup-card.popular {
    border-color:var(--primary-color);
}

.badge-popular {
    position:absolute;
    top:0;
    right:0;
    background:var(--primary-color);
    color:#fff;
    font-size:.7rem;
    font-weight:bold;
    padding:4px 12px;
    border-bottom-left-radius:10px;
}

.cash-badge {
    background:linear-gradient(135deg,#1e2330,#13161f);
    border:1px solid var(--accent-gold);
    color:var(--accent-gold);
    font-weight:700;
    padding:6px 16px;
    border-radius:30px;
    cursor:pointer;
}

.form-control,
.form-select {
    background:#11131a!important;
    border:1px solid var(--card-border)!important;
    color:#fff!important;
    border-radius:10px;
}

.form-control:focus,
.form-select:focus {
    border-color:var(--primary-color)!important;
    box-shadow:0 0 10px var(--primary-glow)!important;
}

.section-title {
    border-left:5px solid var(--primary-color);
    padding-left:12px;
    margin-bottom:24px;
}

.modal-content {
    background:var(--card-bg);
    color:var(--text-color);
    border:1px solid var(--card-border);
    border-radius:20px;
}

.badge-live {
    background:var(--primary-color);
    animation:pulse 1.5s infinite;
}

@keyframes pulse {
    0%,100% {opacity:1}
    50% {opacity:.6}
}

.member-img {
    height:240px;
    object-fit:cover;
}

.ratio-16x9 {
    position:relative;
    width:100%;
    padding-top:56.25%;
    background:#000;
}

.ratio-16x9 iframe {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
}

.chat-box {
    height:350px;
    overflow-y:auto;
    background:#0e1017;
}

.settings-color {
    width:42px;
    height:42px;
    border-radius:50%;
    border:3px solid transparent;
    cursor:pointer;
}

.settings-color.active {
    border-color:#fff;
    box-shadow:0 0 0 2px #000;
}
</style>
</head>

<body>

Fans<span>48</span>

</nav>

<div class="modal-dialog modal-dialog-centered">
<div class="modal-content p-3">

<div class="modal-header border-0">

<div class="modal-body">

<!-- PLAYER MODAL -->
<div class="modal fade" id="playerModal" tabindex="-1">

<div class="modal-header bg-dark">

</div>

<div class="modal-body p-0">

</div>
</div>

<div class="p-2 bg-dark border-bottom">
<i class="fa-solid fa-comments text-danger me-2"></i>Live Chat
</div>

<div class="chat-box p-3" id="chatContainer"></div>

<form class="p-2 bg-dark d-flex gap-2" onsubmit="sendMessage(event)">
<input id="chatInput" class="form-control" placeholder="Tulis pesan..." required>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* =========================================
   1. KONFIGURASI FIREBASE DATABASE
========================================= */
const firebaseConfig = {
  apiKey: "GANTI_DENGAN_API_KEY_FIREBASE_ANDA",
  authDomain: "GANTI_DENGAN_AUTH_DOMAIN",
  databaseURL: "GANTI_DENGAN_DATABASE_URL",
  projectId: "GANTI_DENGAN_PROJECT_ID",
  storageBucket: "GANTI_DENGAN_STORAGE_BUCKET",
  messagingSenderId: "GANTI_DENGAN_MESSAGING_SENDER_ID",
  appId: "GANTI_DENGAN_APP_ID"
};

// Inisialisasi Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* =========================================
   2. DATA DEFAULTS & GLOBAL STATE
========================================= */
const DEFAULT_SUPERADMIN = {
    email: "admin@fans48.com",
    username: "@superadmin",
    name: "Super Admin",
    password: "admin123",
    role: "superadmin",
    cash: 999999,
    unlockedShows: []
};

const DEFAULT_THEATER_LIST = [
    {
        id: "th-1",
        setlist: "Cara Meminum Ramune",
        team: "JKT48 New Era",
        date: "Hari Ini",
        time: "19:00 WIB",
        category: "live",
        viewers: "14.2k",
        price: 1,
        embedUrl: "https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1"
    },
    {
        id: "th-2",
        setlist: "Itadaki Love",
        team: "JKT48 New Era",
        date: "Besok",
        time: "19:00 WIB",
        category: "upcoming",
        viewers: "-",
        price: 1,
        embedUrl: "https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1"
    }
];

let usersList = [];
let theaterList = [];
let redeemCodes = [];
let currentUser = JSON.parse(localStorage.getItem("fans48_session")) || null;
let currentPage = "home";

let settings = JSON.parse(localStorage.getItem("fans48_settings")) || {
    theme: "dark",
    fontColor: "#f1f1f1"
};

const members = [
    { stageName: "Freya", fullName: "Freyana Jayawardana", team: "New Era", img: "https://via.placeholder.com/300x400/e60012/FFFFFF?text=Freya" },
    { stageName: "Christy", fullName: "Angelina Christy", team: "New Era", img: "https://via.placeholder.com/300x400/e60012/FFFFFF?text=Christy" }
];

let authModal, playerModal;

/* =========================================
   3. INISIALISASI & REALTIME LISTENERS
========================================= */
document.addEventListener("DOMContentLoaded", () => {
    authModal = new bootstrap.Modal(document.getElementById("authModal"));
    playerModal = new bootstrap.Modal(document.getElementById("playerModal"));

    applySettings();
    syncOnlineDatabase();
});

function syncOnlineDatabase() {
    // Sync Users dari Firebase
    db.ref('users').on('value', (snapshot) => {
        const data = snapshot.val();
        usersList = data ? Object.values(data) : [];

        // Pastikan Super Admin Selalu Ada di Online Database
        const adminExists = usersList.some(u => u.username === "@superadmin");
        if (!adminExists) {
            db.ref('users/superadmin').set(DEFAULT_SUPERADMIN);
        }

        // Update Sesi User Saat Ini secara Realtime
        if (currentUser) {
            const updatedMe = usersList.find(u => u.username.toLowerCase() === currentUser.username.toLowerCase());
            if (updatedMe) {
                currentUser = updatedMe;
                localStorage.setItem("fans48_session", JSON.stringify(currentUser));
            }
        }

        updateAuthUI();
        if (currentPage === "admin") renderPage("admin");
    });

    // Sync Theater Shows
    db.ref('theater').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            theaterList = Object.values(data);
        } else {
            // Inisialisasi awal theater jika kosong
            DEFAULT_THEATER_LIST.forEach(t => db.ref('theater/' + t.id).set(t));
        }
        if (currentPage === "theater" || currentPage === "home") renderPage(currentPage);
    });

    // Sync Redeem Codes
    db.ref('redeemCodes').on('value', (snapshot) => {
        const data = snapshot.val();
        redeemCodes = data ? Object.values(data) : [];
        if (currentPage === "admin" || currentPage === "topup") renderPage(currentPage);
    });
}

function makeSafeKey(key) {
    return key.replace(/[^a-zA-Z0-9]/g, "_");
}

function saveUserToFirebase(userObj) {
    const key = makeSafeKey(userObj.username);
    return db.ref('users/' + key).set(userObj);
}

/* =========================================
   4. AUTHENTICATION (LOGIN & REGISTER)
========================================= */
function openAuth() {
    toggleAuth("login");
    authModal.show();
}

function toggleAuth(type) {
    const login = document.getElementById("loginForm");
    const register = document.getElementById("registerForm");
    const title = document.getElementById("authTitle");

    if (type === "register") {
        login.classList.add("d-none");
        register.classList.remove("d-none");
        title.innerHTML = '<i class="fa-solid fa-user-plus text-warning me-2"></i>Daftar Akun';
    } else {
        register.classList.add("d-none");
        login.classList.remove("d-none");
        title.innerHTML = '<i class="fa-solid fa-right-to-bracket text-danger me-2"></i>Login Akun';
    }
}

document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const identifier = document.getElementById("loginIdentifier").value.trim().toLowerCase();
    const password = document.getElementById("loginPassword").value;

    const user = usersList.find(u =>
        (u.email.toLowerCase() === identifier ||
         u.username.toLowerCase() === identifier ||
         u.username.toLowerCase() === "@" + identifier.replace("@", "")) && u.password === password
    );

    if (!user) {
        toast("Username/email atau password salah!", "error");
        return;
    }

    currentUser = user;
    localStorage.setItem("fans48_session", JSON.stringify(currentUser));
    updateAuthUI();
    authModal.hide();
    toast("Login berhasil. Selamat datang " + user.name + "!", "success");
    renderPage(currentPage);
});

document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const name = document.getElementById("regName").value.trim();
    let username = document.getElementById("regUsername").value.trim().toLowerCase();
    const email = document.getElementById("regEmail").value.trim().toLowerCase();
    const password = document.getElementById("regPassword").value;

    if (!username.startsWith("@")) username = "@" + username;

    if (usersList.some(u => u.username.toLowerCase() === username)) {
        toast("Username sudah digunakan!", "error");
        return;
    }

    if (usersList.some(u => u.email.toLowerCase() === email)) {
        toast("Email sudah terdaftar!", "error");
        return;
    }

    const newUser = {
        name: name,
        username: username,
        email: email,
        password: password,
        role: "pelanggan",
        cash: 0,
        unlockedShows: []
    };

    saveUserToFirebase(newUser).then(() => {
        currentUser = newUser;
        localStorage.setItem("fans48_session", JSON.stringify(currentUser));
        updateAuthUI();
        authModal.hide();
        toast("Akun berhasil dibuat & tersimpan di cloud!", "success");
        renderPage("home");
    }).catch(err => {
        toast("Gagal mendaftar: " + err.message, "error");
    });
});

function logout() {
    currentUser = null;
    localStorage.removeItem("fans48_session");
    updateAuthUI();
    renderPage("home");
    toast("Berhasil keluar.", "success");
}

/* =========================================
   5. UI HELPER & NAVIGATION
========================================= */
function updateAuthUI() {
    const area = document.getElementById("userArea");
    const adminNav = document.getElementById("nav-admin-item");

    if (currentUser && (currentUser.role === "superadmin" || currentUser.role === "admin")) {
        adminNav.classList.remove("d-none");
    } else {
        adminNav.classList.add("d-none");
    }

    if (!currentUser) {
        area.innerHTML = `
        <button class="btn btn-outline-light fw-bold" onclick="openAuth()">
            <i class="fa-solid fa-right-to-bracket me-1"></i> Masuk / Daftar
        </button>`;
        return;
    }

    area.innerHTML = `
    <div class="cash-badge" onclick="renderPage('topup')">
        <i class="fa-solid fa-coins me-1"></i>
        ${(currentUser.cash || 0).toLocaleString()} Cash
    </div>

    <div class="dropdown">
        <button class="btn btn-dark border-secondary dropdown-toggle" data-bs-toggle="dropdown">
            <i class="fa-solid fa-user-circle text-danger me-1"></i>
            ${escapeHTML(currentUser.name)}
        </button>

        <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
            <li><span class="dropdown-item-text">${escapeHTML(currentUser.username)}</span></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#" onclick="renderPage('settings')"><i class="fa-solid fa-gear me-2"></i>Settings</a></li>
            ${canAccessAdmin() ? `<li><a class="dropdown-item text-danger fw-bold" href="#" onclick="renderPage('admin')"><i class="fa-solid fa-user-shield me-2"></i>Admin Panel</a></li>` : ""}
            <li><a class="dropdown-item text-danger" href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket me-2"></i>Keluar</a></li>
        </ul>
    </div>`;
}

function canAccessAdmin() {
    return currentUser && (currentUser.role === "superadmin" || currentUser.role === "admin");
}

function renderPage(page) {
    currentPage = page;
    document.querySelectorAll(".nav-link").forEach(x => x.classList.remove("active"));
    const activeNav = document.getElementById("nav-" + (page === "memberLive" ? "member-live" : page));
    if (activeNav) activeNav.classList.add("active");

    const container = document.getElementById("main-content");
    container.classList.add("page-hidden");

    setTimeout(() => {
        if (page === "home") container.innerHTML = getHomeHTML();
        else if (page === "theater") container.innerHTML = getTheaterHTML();
        else if (page === "memberLive") container.innerHTML = getMemberLiveHTML();
        else if (page === "member") container.innerHTML = getMemberHTML();
        else if (page === "topup") container.innerHTML = getTopupHTML();
        else if (page === "admin") {
            if (!canAccessAdmin()) {
                toast("Akses ditolak!", "error");
                renderPage("home");
                return;
            }
            container.innerHTML = getAdminHTML();
        } else if (page === "settings") container.innerHTML = getSettingsHTML();

        container.classList.remove("page-hidden");
    }, 200);
}

/* =========================================
   6. PAGES TEMPLATES
========================================= */
function getHomeHTML() {
    return `
    <div class="hero-banner mb-5 text-center text-lg-start">
        <div class="row align-items-center">
            <div class="col-lg-8">
                <h1 class="display-5 fw-bold mb-3">Selamat Datang di <span class="text-danger">Fans48</span> Hub</h1>
                <p class="lead text-muted mb-4">Platform terlengkap bagi para pengagum idol 48 Group. Nikmati streaming theater interaktif, live member, hingga tukar promo redeem code dengan mudah!</p>
                <div class="d-flex gap-3 justify-content-center justify-content-lg-start">
                    <button class="btn btn-danger btn-lg fw-bold px-4" onclick="renderPage('theater')"><i class="fa-solid fa-play me-2"></i>Nonton Theater</button>
                    <button class="btn btn-outline-warning btn-lg fw-bold px-4" onclick="renderPage('topup')"><i class="fa-solid fa-gift me-2"></i>Kode Redeem</button>
                </div>
            </div>
            <div class="col-lg-4 d-none d-lg-block text-center fs-1 text-danger">
                <i class="fa-solid fa-heart-pulse fa-5x opacity-75"></i>
            </div>
        </div>
    </div>

    <div class="section-title">
        <h3 class="fw-bold"><i class="fa-solid fa-star text-warning me-2"></i>Fitur Unggulan Fans48</h3>
        <small class="text-muted">Jelajahi semua kemudahan yang kami sediakan untuk kenyamanan streaming Anda.</small>
    </div>

    <div class="row g-4">
        <div class="col-md-6 col-lg-4">
            <div class="card p-4 feature-card">

function getTheaterHTML() {

function renderTheaterCard(t) {
    const unlocked = currentUser && currentUser.unlockedShows && currentUser.unlockedShows.includes(t.id);
    return `
    <div class="col-md-6">
        <div class="card p-3 h-100">
            <div class="d-flex justify-content-between mb-3">
                <span class="badge ${t.category === "live" ? "badge-live" : t.category === "upcoming" ? "bg-warning text-dark" : "bg-info text-dark"}">
                    ${t.category === "live" ? "LIVE NOW" : t.category === "upcoming" ? "UPCOMING" : "REPLAY"}
                </span>
                <span class="text-muted small">${t.date} • ${t.time}</span>
            </div>
            <h4 class="fw-bold">${escapeHTML(t.setlist)}</h4>
            <p class="text-danger fw-bold">${escapeHTML(t.team)}</p>
            <div class="mt-auto pt-3 border-top border-secondary d-flex justify-content-between align-items-center">
                <span class="text-muted"><i class="fa-solid fa-eye"></i> ${t.viewers}</span>
                ${t.category === "upcoming"
                    ? `<button class="btn btn-secondary btn-sm" disabled><i class="fa-solid fa-clock me-1"></i> Belum Mulai</button>`
                    : unlocked
                    ? `<button class="btn btn-success btn-sm fw-bold" onclick="openPlayer('${t.id}','theater')"><i class="fa-solid fa-play me-1"></i> Putar Show</button>`
                    : `<button class="btn btn-danger btn-sm fw-bold" onclick="buyShow('${t.id}')"><i class="fa-solid fa-ticket me-1"></i> Tonton 1 Cash</button>`
                }
            </div>
        </div>
    </div>`;
}

function buyShow(id) {
    if (!currentUser) {
        toast("Silakan login terlebih dahulu!", "error");
        openAuth();
        return;
    }

    if ((currentUser.cash || 0) < 1) {
        toast("Cash tidak cukup!", "error");
        renderPage("topup");
        return;
    }

    if (!currentUser.unlockedShows) currentUser.unlockedShows = [];
    currentUser.cash--;
    currentUser.unlockedShows.push(id);

    saveUserToFirebase(currentUser).then(() => {
        toast("Show berhasil dibuka!", "success");
        openPlayer(id, "theater");
    });
}

/* =========================================
   7. ADMIN ACTIONS & TOPUP REDEEM
========================================= */
function createRedeemCode() {
    const code = document.getElementById("newRedeemCode").value.trim().toUpperCase();
    const cash = parseInt(document.getElementById("newRedeemCash").value);
    const quota = parseInt(document.getElementById("newRedeemQuota").value);

    if (!code || !cash || !quota) {
        toast("Isi semua kolom kode redeem!", "error");
        return;
    }

    const obj = { code, cash, quota, usedCount: 0, usedBy: [] };
    db.ref('redeemCodes/' + code).set(obj).then(() => {
        toast("Kode redeem berhasil disimpan di server!", "success");
    });
}

function deleteRedeemCode(code) {
    db.ref('redeemCodes/' + code).remove().then(() => {
        toast("Kode redeem dihapus!", "success");
    });
}

function injectCash(e) {
    e.preventDefault();
    let username = document.getElementById("injectUsername").value.trim().toLowerCase();
    if (!username.startsWith("@")) username = "@" + username;
    const amount = parseInt(document.getElementById("injectAmount").value);

    const target = usersList.find(u => u.username.toLowerCase() === username);
    if (!target) {
        toast("Username tidak ditemukan!", "error");
        return;
    }

    target.cash = (target.cash || 0) + amount;
    saveUserToFirebase(target).then(() => {
        toast(`Berhasil menambah +${amount} Cash ke ${target.username}`, "success");
    });
}

function changeRole(e) {
    e.preventDefault();
    let username = document.getElementById("roleUsername").value.trim().toLowerCase();
    if (!username.startsWith("@")) username = "@" + username;
    const role = document.getElementById("newRole").value;

    const target = usersList.find(u => u.username.toLowerCase() === username);
    if (!target) {
        toast("Username tidak ditemukan!", "error");
        return;
    }

    if (target.role === "superadmin") {
        toast("Role Super Admin tidak dapat diubah!", "error");
        return;
    }

    target.role = role;
    saveUserToFirebase(target).then(() => {
        toast(`Role ${target.username} berhasil diubah menjadi ${role}`, "success");
    });
}

function getTopupHTML() {
    return `
    <div class="section-title">
        <h3 class="fw-bold"><i class="fa-solid fa-coins text-warning me-2"></i>Top Up Cash</h3>
        <small class="text-muted">1 Cash = Rp1.000</small>
    </div>

    <div class="card p-4 mb-4 border-warning">
        <h5 class="fw-bold text-warning mb-2"><i class="fa-solid fa-gift me-2"></i>Punya Kode Redeem?</h5>
        <form onsubmit="redeemCode(event)" class="d-flex gap-2">
            <input id="userRedeemInput" class="form-control text-uppercase" placeholder="Masukkan Kode Redeem" required>
            <button class="btn btn-warning fw-bold px-4 text-dark">Tukarkan</button>
        </form>
    </div>

    <div class="row g-4">
        ${[10, 50, 100].map((cash, i) => `
            <div class="col-md-4">
                <div class="topup-card ${i === 1 ? 'popular' : ''}" onclick="topup(${cash})">
                    ${i === 1 ? '<span class="badge-popular">TERLARIS</span>' : ''}
                    <i class="fa-solid fa-coins text-warning fs-2"></i>
                    <h4 class="fw-bold">${cash} Cash</h4>
                    <span class="text-muted">Rp${(cash * 1000).toLocaleString()}</span>
                </div>
            </div>
        `).join("")}
    </div>`;
}

function redeemCode(e) {
    e.preventDefault();
    if (!currentUser) {
        toast("Silakan login terlebih dahulu!", "error");
        openAuth();
        return;
    }

    const inputCode = document.getElementById("userRedeemInput").value.trim().toUpperCase();
    const redeemObj = redeemCodes.find(r => r.code === inputCode);

    if (!redeemObj) {
        toast("Kode redeem tidak valid!", "error");
        return;
    }

    if ((redeemObj.usedCount || 0) >= redeemObj.quota) {
        toast("Kuota kode redeem telah habis!", "error");
        return;
    }

    if (!redeemObj.usedBy) redeemObj.usedBy = [];
    if (redeemObj.usedBy.includes(currentUser.username)) {
        toast("Anda sudah pernah klaim kode ini!", "error");
        return;
    }

    currentUser.cash = (currentUser.cash || 0) + redeemObj.cash;
    redeemObj.usedCount = (redeemObj.usedCount || 0) + 1;
    redeemObj.usedBy.push(currentUser.username);

    saveUserToFirebase(currentUser);
    db.ref('redeemCodes/' + redeemObj.code).set(redeemObj);
    toast(`Selamat! Berhasil tukar +${redeemObj.cash} Cash!`, "success");
}

function topup(amount) {
    if (!currentUser) {
        toast("Silakan login dulu!", "error");
        openAuth();
        return;
    }

    currentUser.cash = (currentUser.cash || 0) + amount;
    saveUserToFirebase(currentUser).then(() => {
        toast(`Top Up berhasil! +${amount} Cash`, "success");
    });
}

function setTheme(theme) {
    settings.theme = theme;
    localStorage.setItem("fans48_settings", JSON.stringify(settings));
    applySettings();
    toast(theme === "dark" ? "Tema gelap aktif." : "Tema terang aktif.", "success");
}

function applySettings() {
    document.body.classList.toggle("light-mode", settings.theme === "light");
}

function openPlayer(id, type) {
    let item = theaterList.find(t => t.id === id) || { setlist: "Member Live", embedUrl: "https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1" };
    document.getElementById("playerTitle").innerText = item.setlist;
    document.getElementById("streamIframe").src = item.embedUrl;
    playerModal.show();
}

function closePlayer() {
    document.getElementById("streamIframe").src = "";
}

function sendMessage(e) {
    e.preventDefault();
    if (!currentUser) return toast("Login untuk kirim pesan!", "error");
    const input = document.getElementById("chatInput");
    if (!input.value.trim()) return;

    const div = document.createElement("div");
    div.className = "small mb-2";
    div.innerHTML = `<span class="text-warning fw-bold">${escapeHTML(currentUser.name)}:</span> <span>${escapeHTML(input.value)}</span>`;
    document.getElementById("chatContainer").appendChild(div);
    input.value = "";
}

function toast(msg, type) {
    const el = document.createElement("div");
    el.className = "position-fixed bottom-0 end-0 p-3";
    el.style.zIndex = "99999";
    el.innerHTML = `<div class="alert ${type === "success" ? "alert-success" : "alert-danger"} shadow">${escapeHTML(msg)}</div>`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
}

function escapeHTML(str) {
    return String(str || '').replace(/[&<>'"]/g, tag => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;"
    }[tag]));
}
